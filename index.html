<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>goodpass — şifre analizi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111;
      color: #e8e8e8;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .box {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
    }

    .box header {
      margin-bottom: 28px;
    }

    .box h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .box h1 span { color: #6d9fff; }

    .tagline {
      font-size: 13px;
      color: #777;
    }

    
    .pw-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #888;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .pw-wrap {
      position: relative;
      margin-bottom: 24px;
    }

    .pw-wrap input {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px 60px 12px 14px;
      font-size: 15px;
      font-family: inherit;
      color: #e8e8e8;
      outline: none;
      transition: border-color .15s;
    }

    .pw-wrap input:focus {
      border-color: #6d9fff;
    }

    .pw-wrap input::placeholder { color: #555; }

    .eye {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 1px solid #333;
      color: #999;
      font-size: 11px;
      font-family: inherit;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .eye:hover { color: #ccc; border-color: #555; }

    
    .metre {
      margin-bottom: 20px;
    }

    .metre-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      margin-bottom: 8px;
      color: #888;
    }

    .metre-top strong {
      font-weight: 600;
      font-size: 13px;
    }

    .metre-track {
      height: 6px;
      background: #222;
      border-radius: 3px;
      overflow: hidden;
    }

    .metre-bar {
      height: 100%;
      width: 0;
      border-radius: 3px;
      transition: width .3s ease-out, background-color .3s;
    }

    @media (prefers-reduced-motion: reduce) {
      .metre-bar { transition: none; }
    }

    
    .nums {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .num {
      background: #151515;
      border: 1px solid #252525;
      border-radius: 10px;
      padding: 12px 14px;
    }

    .num small {
      display: block;
      font-size: 10px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 2px;
    }

    .num b {
      font-size: 16px;
      font-weight: 600;
      color: #ccc;
    }

    
    .checks {
      list-style: none;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .checks li {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #666;
      transition: color .15s;
    }

    .checks li.ok { color: #5cb87a; }

    .checks li::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
      transition: background .15s, box-shadow .15s;
    }

    .checks li.ok::before {
      background: #5cb87a;
      box-shadow: 0 0 6px rgba(92,184,122,.35);
    }

    @media (prefers-reduced-motion: reduce) {
      .checks li, .checks li::before { transition: none; }
    }

    
    .sep {
      border: none;
      border-top: 1px solid #222;
      margin: 0 0 20px;
    }

    
    .breach-btn {
      width: 100%;
      background: #6d9fff;
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }

    .breach-btn:hover:not(:disabled) { opacity: .85; }
    .breach-btn:disabled { opacity: .3; cursor: not-allowed; }

    @media (prefers-reduced-motion: reduce) {
      .breach-btn { transition: none; }
    }

    
    .result {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }

    .result.show { display: block; }

    .result.ok {
      background: rgba(92,184,122,.1);
      border: 1px solid rgba(92,184,122,.2);
      color: #5cb87a;
    }

    .result.bad {
      background: rgba(220,60,60,.1);
      border: 1px solid rgba(220,60,60,.2);
      color: #e55;
    }

    .result.wait {
      background: rgba(109,159,255,.08);
      border: 1px solid rgba(109,159,255,.15);
      color: #6d9fff;
    }

    footer {
      font-size: 11px;
      color: #555;
      text-align: center;
      margin-top: 20px;
      line-height: 1.4;
    }
  </style>
</head>

<body>

  <main class="box" role="main">
    <header>
      <h1>good<span>pass</span></h1>
      <p class="tagline">şifre gücünü analiz et, ihlal veritabanında sorgula</p>
    </header>

    <label class="pw-label" for="pw">şifre</label>
    <div class="pw-wrap">
      <input type="password" id="pw" placeholder="bir şifre yazın…" autocomplete="off" spellcheck="false"
        aria-describedby="strength-label">
      <button type="button" class="eye" id="eyeBtn" aria-label="Şifreyi göster">göster</button>
    </div>

    <div class="metre" role="group" aria-label="Şifre gücü göstergesi">
      <div class="metre-top">
        <span>güç</span>
        <strong id="strengthTxt" aria-live="polite" style="color:#555">—</strong>
      </div>
      <div class="metre-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="metreTrack">
        <div class="metre-bar" id="metreBar"></div>
      </div>
    </div>

    <div class="nums" aria-label="İstatistikler">
      <div class="num">
        <small>entropi</small>
        <b id="vEntropi">—</b>
      </div>
      <div class="num">
        <small>kırılma süresi</small>
        <b id="vTime">—</b>
      </div>
      <div class="num">
        <small>uzunluk</small>
        <b id="vLen">—</b>
      </div>
      <div class="num">
        <small>havuz</small>
        <b id="vPool">—</b>
      </div>
    </div>

    <ul class="checks" aria-label="Gereksinimler">
      <li id="c8">en az 8 karakter</li>
      <li id="cUp">büyük harf (A–Z)</li>
      <li id="cLo">küçük harf (a–z)</li>
      <li id="cDi">rakam (0–9)</li>
      <li id="cSp">özel karakter</li>
      <li id="cRp">ardışık tekrar yok</li>
    </ul>

    <hr class="sep">

    <button class="breach-btn" id="breachBtn" type="button" disabled aria-live="polite">
      ihlal veritabanında ara
    </button>
    <div class="result" id="out" role="status" aria-live="polite"></div>

    <footer>
      k-anonimlik (sha-1 prefix) — şifren sunucuya hiç gönderilmez
    </footer>
  </main>

  <script>
    var pw = document.getElementById('pw');
    var bar = document.getElementById('metreBar');
    var track = document.getElementById('metreTrack');
    var txt = document.getElementById('strengthTxt');
    var btn = document.getElementById('breachBtn');
    var out = document.getElementById('out');
    var eyeBtn = document.getElementById('eyeBtn');
    var vis = false;

    eyeBtn.onclick = function () {
      vis = !vis;
      pw.type = vis ? 'text' : 'password';
      eyeBtn.textContent = vis ? 'gizle' : 'göster';
      eyeBtn.setAttribute('aria-label', vis ? 'Şifreyi gizle' : 'Şifreyi göster');
    };

    function pool(s) {
      var n = 0;
      if (/[a-z]/.test(s)) n += 26;
      if (/[A-Z]/.test(s)) n += 26;
      if (/[0-9]/.test(s)) n += 10;
      if (/[^a-zA-Z0-9]/.test(s)) n += 32;
      return n;
    }

    function entropy(s) {
      var p = pool(s);
      return (!p || !s.length) ? 0 : Math.round(s.length * Math.log2(p));
    }

    function crack(e) {
      if (!e) return '—';
      var sec = Math.pow(2, e) / 1e10;
      if (sec < 1) return '< 1 sn';
      if (sec < 60) return Math.round(sec) + ' sn';
      if (sec < 3600) return Math.round(sec / 60) + ' dk';
      if (sec < 86400) return Math.round(sec / 3600) + ' sa';
      if (sec < 2592000) return Math.round(sec / 86400) + ' gün';
      if (sec < 31536000) return Math.round(sec / 2592000) + ' ay';
      if (sec < 1e9) return Math.round(sec / 31536000) + ' yıl';
      return 'yüzlerce yıl';
    }

    function strength(e) {
      if (!e) return { t: '—', w: 0, c: '#555' };
      if (e < 28) return { t: 'kritik', w: 15, c: '#e55' };
      if (e < 36) return { t: 'zayıf', w: 35, c: '#e88' };
      if (e < 60) return { t: 'orta', w: 55, c: '#da3' };
      if (e < 80) return { t: 'güçlü', w: 82, c: '#5cb87a' };
      return { t: 'mükemmel', w: 100, c: '#5cb87a' };
    }

    function mark(id, ok) {
      var el = document.getElementById(id);
      ok ? el.classList.add('ok') : el.classList.remove('ok');
    }

    pw.oninput = function () {
      var v = pw.value;
      out.className = 'result';

      if (!v) {
        bar.style.width = '0';
        bar.style.background = 'transparent';
        txt.textContent = '—';
        txt.style.color = '#555';
        track.setAttribute('aria-valuenow', '0');
        document.getElementById('vEntropi').textContent = '—';
        document.getElementById('vTime').textContent = '—';
        document.getElementById('vLen').textContent = '—';
        document.getElementById('vPool').textContent = '—';
        btn.disabled = true;
        ['c8','cUp','cLo','cDi','cSp','cRp'].forEach(function(id) { mark(id, false); });
        return;
      }

      var e = entropy(v);
      var s = strength(e);

      bar.style.width = s.w + '%';
      bar.style.background = s.c;
      txt.textContent = s.t;
      txt.style.color = s.c;
      track.setAttribute('aria-valuenow', String(s.w));

      document.getElementById('vEntropi').textContent = e + ' bit';
      document.getElementById('vTime').textContent = crack(e);
      document.getElementById('vLen').textContent = v.length;
      document.getElementById('vPool').textContent = pool(v);

      mark('c8', v.length >= 8);
      mark('cUp', /[A-Z]/.test(v));
      mark('cLo', /[a-z]/.test(v));
      mark('cDi', /[0-9]/.test(v));
      mark('cSp', /[^a-zA-Z0-9]/.test(v));
      mark('cRp', !/(.)\\1{2,}/.test(v));

      btn.disabled = false;
    };

    btn.onclick = async function () {
      var v = pw.value;
      if (!v) return;

      out.textContent = 'sorgulanıyor…';
      out.className = 'result show wait';
      btn.disabled = true;

      try {
        var enc = new TextEncoder();
        var buf = await crypto.subtle.digest('SHA-1', enc.encode(v));
        var hex = Array.from(new Uint8Array(buf)).map(function (b) {
          return b.toString(16).padStart(2, '0');
        }).join('').toUpperCase();

        var pre = hex.slice(0, 5);
        var suf = hex.slice(5);
        var res = await fetch('https://api.pwnedpasswords.com/range/' + pre);
        var body = await res.text();
        var hit = body.split('\n').find(function (l) { return l.startsWith(suf); });

        if (hit) {
          var cnt = parseInt(hit.split(':')[1]).toLocaleString('tr-TR');
          out.innerHTML = '<b>dikkat:</b> bu şifre ' + cnt + ' kez sızdırılmış. değiştirmeniz önerilir.';
          out.className = 'result show bad';
        } else {
          out.textContent = 'bu şifre bilinen ihlal veritabanlarında bulunamadı.';
          out.className = 'result show ok';
        }
      } catch (_) {
        out.textContent = 'sorgu başarısız — bağlantınızı kontrol edin.';
        out.className = 'result show bad';
      } finally {
        btn.disabled = false;
      }
    };
  </script>

</body>

</html>
